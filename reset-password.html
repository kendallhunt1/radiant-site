<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | Radiant Health</title>

    <style>
        body {
          margin: 0;
          font-family: Arial, sans-serif;
          background: #f5f7fb;
          color: #111827;
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          padding: 24px;
        }

        .card {
          max-width: 420px;
          width: 100%;
          background: white;
          border-radius: 20px;
          padding: 36px;
          text-align: center;
          box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        .brand {
          font-size: 20px;
          font-weight: 700;
          letter-spacing: 2px;
          margin-bottom: 24px;
        }

        h1 {
          font-size: 26px;
          margin-bottom: 12px;
        }

        p {
          color: #6b7280;
          line-height: 1.5;
        }

        input {
          width: 100%;
          box-sizing: border-box;
          padding: 14px;
          margin-top: 18px;
          border-radius: 12px;
          border: 1px solid #d1d5db;
          font-size: 16px;
        }

        button {
          width: 100%;
          margin-top: 18px;
          padding: 14px;
          border: none;
          border-radius: 12px;
          background: #2E9C7E;
          color: white;
          font-size: 16px;
          font-weight: 700;
          cursor: pointer;
        }

        .message {
          margin-top: 18px;
          font-size: 14px;
        }

        .success {
          color: #2E9C7E;
        }

        .error {
          color: #dc2626;
        }
    </style>
</head>

<body>
<div class="card">
    <div class="brand">RADIANT HEALTH</div>

    <h1>Reset your password</h1>
    <p>Enter a new password for your Radiant Health account.</p>

    <input id="password" type="password" placeholder="New password" />
    <button onclick="resetPassword()">Reset Password</button>

    <div id="message" class="message"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB9kjhZpjBB3LO4bv61bquJs8SRdoSEvAc",
      authDomain: "gethealthy-6d888.firebaseapp.com",
      projectId: "gethealthy-6d888",
      storageBucket: "gethealthy-6d888.firebasestorage.app",
      messagingSenderId: "66721186978",
      appId: "1:66721186978:web:9301faa468fbefa9fb03fb",
      measurementId: "G-HS90RNP746"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const params = new URLSearchParams(window.location.search);
    const oobCode = params.get("oobCode");

    window.resetPassword = async function () {
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      message.textContent = "";
      message.className = "message";

      if (!oobCode) {
        message.textContent = "This reset link is invalid or missing.";
        message.classList.add("error");
        return;
      }

      if (password.length < 6) {
        message.textContent = "Password must be at least 6 characters.";
        message.classList.add("error");
        return;
      }

      try {
        await confirmPasswordReset(auth, oobCode, password);
        message.textContent = "Password reset successfully. You can now return to the app.";
        message.classList.add("success");
      } catch (error) {
        console.error(error);

      message.textContent =
        `${error.code}: ${error.message}`;

      message.classList.add("error");
      }
    };
</script>
</body>
</html>
